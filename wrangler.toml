name = "gearboxgiants"
main = "worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"

[[kv_namespaces]]
binding = "SEO_AUTH"
id = "seo_auth_kv"

[durable_objects]
bindings = [
  { name = "LOGIN_LIMITER", class_name = "LoginRateLimiter" }
]

[[migrations]]
tag = "v1"
new_classes = ["LoginRateLimiter"]

[triggers]
crons = ["0 */6 * * *"]


