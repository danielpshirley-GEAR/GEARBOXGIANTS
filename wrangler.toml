name = "gearboxgiants"
main = "worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "gearboxgiants.co.uk", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "SEO_AUTH"
id = "c7bfffa529e24d6ca893e979644ebd16"

[durable_objects]
bindings = [
  { name = "LOGIN_LIMITER", class_name = "LoginRateLimiter" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoginRateLimiter"]

[triggers]
crons = ["0 */6 * * *"]

[vars]
ADMIN_USERNAME = "shirley"
GA4_MEASUREMENT_ID = "G-LZ86MKNF79"
GA4_PROPERTY_ID = "553039728"


